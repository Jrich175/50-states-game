<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>50 States Voice Game</title><style>body{background:#101b2b;color:white;font:17px system-ui;margin:0}main{max-width:650px;margin:auto;padding:20px}h1{margin:8px 0}p{color:#b6c6d8}.panel{background:#1c2c42;border-radius:20px;padding:16px;margin:16px 0}svg{width:100%;height:320px}button{border:0;border-radius:12px;padding:14px 20px;margin:5px;background:#6bc8ff;color:#092039;font-weight:bold;font-size:16px}button.secondary{background:#344d6c;color:white}#feedback{font-size:23px;font-weight:bold;min-height:35px}#status{color:#b6c6d8}label{display:block;margin:15px 0}#map{display:grid;place-items:center;min-height:320px}#progress{height:8px;background:#344d6c;border-radius:10px;overflow:hidden}#bar{height:100%;width:0;background:#6bc8ff}small{color:#b6c6d8}</style><main><h1>50 States Challenge</h1><p>See the shape. Say the state. No typing. · Improved Census outlines</p><div class="panel"><div id="stats">Round 1 / 50 · Score 0</div><div id="progress"><div id="bar"></div></div><div id="map">Loading real state boundaries…</div><div id="feedback">Preparing game…</div><div id="heard"></div></div><button id="start">Start listening</button><button class="secondary" id="skip">Skip</button><button class="secondary" id="reset">New game</button><label><input id="stars" type="checkbox"> Show state capital star</label><div id="status">Microphone off</div><p><small>On iPhone, speech recognition depends on Safari support and may pause or need restarting. You can say “skip.”</small></p></main><script>
const names=["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"],capitals=[[-86.3,32.377],[-134.42,58.302],[-112.074,33.448],[-92.289,34.746],[-121.494,38.582],[-104.99,39.739],[-72.683,41.764],[-75.524,39.158],[-84.281,30.438],[-84.388,33.749],[-157.858,21.309],[-116.202,43.615],[-89.65,39.782],[-86.158,39.768],[-93.609,41.586],[-95.678,39.048],[-84.873,38.2],[-91.14,30.451],[-69.779,44.31],[-76.492,38.978],[-71.059,42.36],[-84.555,42.733],[-93.09,44.954],[-90.185,32.299],[-92.173,38.577],[-112.039,46.589],[-96.685,40.814],[-119.767,39.164],[-71.538,43.208],[-74.769,40.221],[-105.938,35.687],[-73.757,42.653],[-78.639,35.78],[-100.783,46.808],[-82.999,39.961],[-97.516,35.468],[-123.035,44.943],[-76.884,40.273],[-71.413,41.824],[-81.034,34.001],[-100.351,44.368],[-86.782,36.163],[-97.743,30.267],[-111.891,40.761],[-72.575,44.26],[-77.436,37.541],[-122.9,47.037],[-81.633,38.35],[-89.401,43.073],[-104.82,41.14]];
const $=id=>document.getElementById(id);let features={},order=[],i=0,score=0,enabled=false,rec=null,locked=false,retry=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function shuffle(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function coords(g){let x=[];function walk(v){if(typeof v[0]==='number')x.push(v);else v.forEach(walk)}walk(g.coordinates);return x}
function render(){if(i===50){$('map').textContent='Finished!';$('feedback').textContent='Final score: '+score+' / 50';return}let name=order[i],g=features[name].geometry,pts=coords(g);function longitude(lon){return name==='Alaska'&&lon>0?lon-360:lon}let midLat=(Math.min(...pts.map(p=>p[1]))+Math.max(...pts.map(p=>p[1])))/2;let correction=Math.cos(midLat*Math.PI/180);function projected(p){return [longitude(p[0])*correction,p[1]]}let pp=pts.map(projected),xs=pp.map(p=>p[0]),ys=pp.map(p=>p[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),scale=Math.min(450/(maxx-minx),280/(maxy-miny)),cx=(minx+maxx)/2,cy=(miny+maxy)/2;function xy(p){let q=projected(p);return [(q[0]-cx)*scale+250,(cy-q[1])*scale+160]}function ring(r){return r.map((p,k)=>(k?'L':'M')+xy(p).map(v=>v.toFixed(2)).join(' ')).join(' ')+' Z'}let polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;let paths=polys.map(poly=>poly.map(ring).join(' ')).join(' ');let c=capitals[names.indexOf(name)],pt=xy(c);$('map').innerHTML='<svg viewBox="0 0 500 320" aria-label="State outline"><path d="'+paths+'" fill="#8fbce9" fill-rule="evenodd" stroke="#d6e9ff" stroke-width="2" stroke-linejoin="round"/>'+($('stars').checked?'<text x="'+pt[0]+'" y="'+pt[1]+'" text-anchor="middle" font-size="24" fill="#f6c448" stroke="#17273b" stroke-width=".7">★</text>':'')+'</svg>';$('stats').textContent='Round '+(i+1)+' / 50 · Score '+score;$('bar').style.width=(i*2)+'%'}
function done(ok,skip){if(locked||i>=50)return;locked=true;let name=order[i];if(ok)score++;$('feedback').textContent=ok?'✓ Correct! '+name:skip?'Skipped — '+name:'✗ It was '+name;i++;setTimeout(()=>{locked=false;$('feedback').textContent='Which state is this?';$('heard').textContent='';render()},1600)}
function handle(t){if(locked||i>=50)return;let s=t.toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();$('heard').textContent='Heard: '+t;if(/\b(skip|pass|next state)\b/.test(s)){done(false,true);return}let a=order[i].toLowerCase();if(s===a||s.includes(a)||a==='new mexico'&&s==='mexico'){done(true,false);return}let found=names.filter(n=>s===n.toLowerCase()||s.endsWith(' '+n.toLowerCase()));if(found.length===1)done(false,false)}
function launch(){if(!enabled||!SR)return;try{rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=false;rec.onresult=e=>{for(let j=e.resultIndex;j<e.results.length;j++)if(e.results[j].isFinal)handle(e.results[j][0].transcript)};rec.onstart=()=>{$('status').textContent='Listening — say a state';$('start').textContent='Stop listening'};rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){enabled=false;$('status').textContent='Microphone access denied'}else $('status').textContent='Reconnecting…'};rec.onend=()=>{if(enabled){$('status').textContent='Reconnecting…';retry=setTimeout(launch,600)}else $('status').textContent='Microphone off'};rec.start()}catch(e){retry=setTimeout(launch,1200)}}
function stop(){enabled=false;clearTimeout(retry);if(rec){rec.onend=null;try{rec.stop()}catch(e){}}$('status').textContent='Microphone off';$('start').textContent='Start listening'}
$('start').onclick=()=>{if(enabled){stop();return}if(!SR){$('status').textContent='Speech recognition unavailable in this browser';return}enabled=true;launch()};$('skip').onclick=()=>done(false,true);$('reset').onclick=()=>{stop();i=0;score=0;order=shuffle([...names]);locked=false;render();$('feedback').textContent='Which state is this?'};$('stars').onchange=()=>{if(order.length)render()};
async function load(){try{let r=await fetch('https://static.geodataviewer.com/datasets/us-states.geojson',{cache:'no-store'});if(!r.ok)throw Error('Boundary source unavailable');let data=await r.json();for(let f of data.features){let n=f.properties.shapeName||f.properties.name;if(names.includes(n))features[n]=f}if(Object.keys(features).length!==50)throw Error('Incomplete boundary set');order=shuffle([...names]);render();$('feedback').textContent='Which state is this?'}catch(e){$('map').textContent='Could not load detailed outlines. Please refresh.';$('feedback').textContent='Boundary data unavailable';$('status').textContent=String(e.message)}}load();
</script></html>
